.q4 {
  --bg: #09090B;
  --bg2: #101012;
  --line: #232327;
  --txt: #FAFAFA;
  --mut: #8A8A93;
  --red: #FF2800;
  --red-soft: rgba(255,40,0,.10);
  --red-line: rgba(255,40,0,.55);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--txt); min-height: 100vh; width: 100%;
  -webkit-font-smoothing: antialiased; letter-spacing: -0.011em;
}
.q4 *, .q4 *::before, .q4 *::after { box-sizing: border-box; }
.q4 { overflow-x: hidden; overflow-wrap: break-word; word-break: break-word; }
.q4 button, .q4 input { font-family: inherit; letter-spacing: inherit; touch-action: manipulation; }

.q4-wrap { max-width: 560px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 28px); }

.q4-top { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 14px 0 0; }
.q4-topin { display: flex; align-items: center; min-height: 20px; }
.q4-back { background: none; border: none; color: var(--mut); font-size: 11px; font-weight: 500; opacity: .55; cursor: pointer; padding: 12px 14px 12px 0; margin: -12px 0 -12px 0; min-height: 44px; display: inline-flex; align-items: center; transition: opacity .2s; }
.q4-back:hover, .q4-back:focus-visible, .q4-back:active { opacity: 1; }
.q4-rail { height: 2px; background: #1B1B1F; margin-top: 12px; border-radius: 2px; overflow: hidden; }
.q4-railin { height: 100%; background: var(--red); border-radius: 2px; transition: width .55s cubic-bezier(.16,.9,.25,1); }

.q4-screen { padding: clamp(28px, 6vw, 40px) 0 60px; animation: q4in .34s cubic-bezier(.2,.8,.2,1) both; }
@keyframes q4in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.q4-eyebrow { font-size: 11px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; color: var(--red); display: block; margin-bottom: 18px; }
.q4-eyebrow.mut { color: var(--mut); }

.q4-q { font-size: clamp(22px, 6vw, 27px); line-height: 1.22; font-weight: 700; letter-spacing: -.028em; margin: 0 0 12px; }
.q4-sub { font-size: clamp(14.5px, 4vw, 16px); line-height: 1.5; color: var(--mut); margin: 0; font-weight: 400; }

.q4-opts { display: flex; flex-direction: column; gap: 12px; margin-top: clamp(22px, 5vw, 28px); }
.q4-opts.locked { pointer-events: none !important; }
.q4-opt {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; min-height: 48px;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; color: var(--txt);
  padding: clamp(15px, 4vw, 17px) 16px; font-size: clamp(16px, 4.1vw, 16.5px); line-height: 1.3; font-weight: 450;
  cursor: pointer; transition: all .18s cubic-bezier(.2,.8,.2,1);
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.q4-opt:hover { border-color: var(--red); background: var(--red-soft); }
.q4-opt:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.q4-opt.on { border-color: var(--red); background: var(--red-soft); }
.q4-opt.pre { border-color: var(--red-line); }
.q4-dot { width: 19px; height: 19px; flex: 0 0 19px; border-radius: 50%; border: 1.5px solid #3A3A40; transition: all .2s; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; font-weight: 700; }
.q4-opt:hover .q4-dot { border-color: var(--red); }
.q4-opt.on .q4-dot { border-color: var(--red); background: var(--red); color: #fff; }
.q4-opt.pre .q4-dot { border-color: var(--red-line); }

.q4-cta { width: 100%; min-height: 48px; background: var(--red); color: #fff; border: none; border-radius: 12px; padding: clamp(15px, 4.5vw, 18px); font-size: clamp(16px, 4.2vw, 16.5px); font-weight: 650; letter-spacing: -.015em; cursor: pointer; margin-top: 22px; transition: all .2s; }
.q4-cta:hover { filter: brightness(1.12); }
.q4-cta:disabled { opacity: .28; cursor: not-allowed; filter: none; }
.q4-cta { position: relative; overflow: hidden; }
.q4-cta-txt { position: relative; z-index: 1; }
.q4-cta.q4-wait { background: #17171B; border: 1px solid var(--line); color: #7C7C86; cursor: default; opacity: 1; }
.q4-cta.q4-wait:disabled { opacity: 1; }
.q4-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,40,0,.16); transition-property: width; transition-timing-function: linear; }

.q4-selo { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--red); border: 1px solid var(--red-line); background: var(--red-soft); border-radius: 999px; padding: 7px 13px; margin-bottom: 20px; }
.q4-selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: q4pulse 1.6s ease-in-out infinite; }
@keyframes q4pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

.q4-linhas span { display: block; }

.q4-delay.on { opacity: 1; transform: none; pointer-events: auto; }

.q4-cover { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; padding: 36px 0; }

.q4-h1 em { font-style: normal; color: var(--red); }
.q4-lead { font-size: clamp(15px, 4.2vw, 17px); line-height: 1.5; color: var(--mut); font-weight: 400; margin: 0 0 30px; }

.q4-cons { min-height: 78vh; display: flex; flex-direction: column; justify-content: center; }
.q4-ctit { font-size: clamp(22px, 6vw, 27px); line-height: 1.22; font-weight: 700; letter-spacing: -.028em; margin: 0 0 22px; }
.q4-cp { font-size: clamp(16.5px, 4.5vw, 18.5px); line-height: 1.42; font-weight: 500; color: #DBDBE1; margin: 0 0 18px; letter-spacing: -.015em; }
.q4-crm { font-size: clamp(18px, 5vw, 21px); line-height: 1.38; font-weight: 700; color: var(--txt); margin: 24px 0 0; letter-spacing: -.025em; border-left: 2px solid var(--red); padding-left: 16px; }

.q4-input { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; color: var(--txt); padding: clamp(15px, 4.5vw, 18px) 16px; font-size: clamp(16px, 4.5vw, 17px); font-weight: 500; margin-top: 24px; }
.q4-input:focus { outline: none; border-color: var(--red); background: var(--red-soft); }

.q4-mnota { font-size: clamp(13.5px, 3.8vw, 14.5px); line-height: 1.5; color: var(--mut); margin: 0; padding-top: 16px; border-top: 1px solid var(--line); margin-top: 4px; }
.q4-mnota b { color: var(--txt); font-weight: 650; }

.q4-check { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: clamp(15px, 4.1vw, 16px); line-height: 1.42; }
.q4-check span:first-child { color: var(--red); font-weight: 700; flex: 0 0 auto; }

.q4-alerta { border: 1px solid var(--red-line); border-radius: 14px; padding: clamp(16px, 5vw, 20px); margin: 28px 0; }
.q4-alerta p { font-size: clamp(15px, 4.2vw, 16px); line-height: 1.55; color: #D6D6DC; margin: 0; }
.q4-alerta p b { color: var(--txt); }

.q4-item { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: clamp(14.5px, 4vw, 15.5px); line-height: 1.5; }
.q4-item > span:first-child { color: var(--red); font-size: clamp(15px, 4vw, 17px); font-weight: 700; padding-top: 1px; flex: 0 0 auto; }
.q4-item b { font-weight: 650; color: var(--txt); }

/* carrossel n\xEDvel 4 */
.q4-carr { margin: 20px 0 8px; }
.q4-carr-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding-bottom: 12px; scrollbar-width: none; }
.q4-carr-track::-webkit-scrollbar { display: none; }
.q4-slide { scroll-snap-align: center; flex: 0 0 78%; max-width: 300px; border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; background: var(--bg2); }
.q4-slide-n { font-size: 12px; font-weight: 700; color: #4E4E57; letter-spacing: .1em; }
.q4-slide-t { font-size: 22px; font-weight: 700; letter-spacing: -.03em; color: var(--red); margin: 10px 0 8px; }
.q4-slide-d { font-size: 15.5px; line-height: 1.5; color: #C7C7CE; margin: 0; }
.q4-dots { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
.q4-dotc { position: relative; width: 6px; height: 6px; border-radius: 50%; background: #2E2E36; transition: all .2s; border: none; padding: 0; cursor: pointer; }
.q4-dotc::before { content: ""; position: absolute; top: 50%; left: 50%; width: 32px; height: 32px; transform: translate(-50%, -50%); }
.q4-dotc.on { background: var(--red); width: 18px; border-radius: 3px; }

/* grid de fascina\xE7\xE3o */
.q4-fasc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 8px; }
@media (max-width: 440px) { .q4-fasc { grid-template-columns: 1fr; } }
.q4-fc { border: 1px solid var(--line); border-radius: 12px; padding: 15px 16px; background: var(--bg2); }
.q4-fct { font-size: clamp(15px, 4.2vw, 16px); font-weight: 700; letter-spacing: -.02em; color: var(--txt); margin: 0 0 6px; line-height: 1.25; }
.q4-fcd { font-size: clamp(13px, 3.6vw, 13.5px); line-height: 1.45; color: var(--mut); margin: 0; }

.q4-datas { display: flex; gap: 6px; margin: 20px 0 6px; }
.q4-data { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: clamp(9px, 2.5vw, 12px) 4px; text-align: center; min-width: 0; }
.q4-datad { font-size: clamp(13px, 3.7vw, 15px); font-weight: 700; letter-spacing: -.02em; }
.q4-datal { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); margin-top: 3px; font-weight: 650; }

.q4-h2 { font-size: clamp(25px, 7vw, 31px); line-height: 1.1; font-weight: 700; letter-spacing: -.035em; margin: 0 0 16px; }
.q4-h3 { font-size: clamp(11px, 3vw, 11.5px); font-weight: 650; letter-spacing: .16em; text-transform: uppercase; color: var(--mut); margin: clamp(30px, 7vw, 38px) 0 16px; }
.q4-sec { padding-top: clamp(34px, 9vw, 52px); margin-top: clamp(20px, 5vw, 26px); border-top: 1px solid var(--line); }
.q4-sec > .q4-h3:first-child { margin-top: 0; }

.q4-depois { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.q4-depois-item { background: var(--bg2); padding: 15px 16px; display: flex; gap: 13px; align-items: flex-start; font-size: clamp(15px, 4.1vw, 16px); line-height: 1.4; color: var(--txt); font-weight: 500; }
.q4-depois-n { color: var(--red); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; padding-top: 3px; flex: 0 0 auto; }

.q4-fechamento { text-align: left; }
.q4-fech-l1 { font-size: clamp(17px, 4.7vw, 19px); line-height: 1.4; font-weight: 500; color: #D6D6DC; margin: 0 0 14px; }
.q4-fech-l2 { font-size: clamp(21px, 5.8vw, 25px); line-height: 1.28; font-weight: 700; letter-spacing: -.03em; color: var(--txt); margin: 0 0 14px; border-left: 2px solid var(--red); padding: 4px 0 4px 16px; }
.q4-fech-l3 { font-size: clamp(15.5px, 4.2vw, 16.5px); line-height: 1.5; color: #C7C7CE; margin: 0 0 4px; }

.q4-card { border: 1px solid var(--line); border-radius: 14px; padding: clamp(16px, 5vw, 20px); margin: 24px 0; }
.q4-card.red { border-color: var(--red-line); }
.q4-card p { font-size: clamp(14.5px, 4vw, 15.5px); line-height: 1.58; color: #C7C7CE; margin: 0; }
.q4-card p b { color: var(--txt); font-weight: 650; }

.q4-preco { text-align: center; padding: 30px 0 8px; }
.q4-de { font-size: clamp(18px, 5vw, 22px); color: var(--mut); text-decoration: line-through; text-decoration-color: var(--red); margin: 0 0 6px; font-weight: 500; }
.q4-pv { font-size: clamp(32px, 9vw, 42px); font-weight: 700; letter-spacing: -.035em; line-height: 1.05; margin: 0; }
.q4-pv-prefix { font-size: clamp(13px, 3.6vw, 14px); font-weight: 500; color: var(--mut); letter-spacing: 0; margin-right: 4px; }
.q4-parc { font-size: clamp(13px, 3.6vw, 14px); color: var(--mut); margin: 12px 0 0; }
.q4-avista { font-size: clamp(13px, 3.6vw, 14px); color: var(--txt); margin: 3px 0 0; font-weight: 600; }
.q4-janela { font-size: clamp(13px, 3.8vw, 14.5px); color: #D6D6DC; margin: 18px auto 0; line-height: 1.55; max-width: 380px; }
.q4-janela b { color: var(--red); font-weight: 650; }

.q4-faqi { border-bottom: 1px solid var(--line); }
.q4-faqb { width: 100%; background: none; border: none; color: var(--txt); text-align: left; padding: 18px 0; font-size: clamp(15px, 4.2vw, 16px); font-weight: 550; cursor: pointer; display: flex; justify-content: space-between; gap: 14px; }
.q4-faqb span:last-child { color: var(--red); font-size: 17px; flex: 0 0 auto; }
.q4-faqa { font-size: clamp(14px, 4vw, 15px); line-height: 1.6; color: var(--mut); padding: 0 0 18px; margin: 0; }


.q4-link { display: block; text-align: center; color: var(--mut); font-size: 14px; margin-top: 8px; padding: 10px 0; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- tela de an\xE1lise ---------- */
.q4-conta { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 30px; }
.q4-conta b { font-size: clamp(44px, 13vw, 60px); font-weight: 700; letter-spacing: -.05em; line-height: 1; color: var(--red); font-variant-numeric: tabular-nums; }
.q4-conta span { font-size: clamp(14px, 3.9vw, 15px); color: var(--mut); font-weight: 500; }
.q4-etapas { display: flex; flex-direction: column; gap: 14px; margin-bottom: 30px; }
.q4-etapa { display: flex; align-items: center; gap: 12px; transition: opacity .35s ease, transform .35s ease; }
.q4-etapa.espera { opacity: .3; }
.q4-etapa.agora { opacity: 1; }
.q4-etapa.ok { opacity: .62; }
.q4-etapa-dot { width: 20px; height: 20px; flex: 0 0 20px; border-radius: 50%; border: 1.5px solid #33333B; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: transparent; transition: all .3s ease; }
.q4-etapa.ok .q4-etapa-dot { border-color: var(--red); background: var(--red); color: #fff; }
.q4-etapa.agora .q4-etapa-dot { border-color: var(--red); animation: q4pulse 1.1s ease-in-out infinite; }
.q4-etapa-txt { font-size: clamp(14.5px, 4vw, 15.5px); line-height: 1.35; color: #C7C7CE; }
.q4-etapa.agora .q4-etapa-txt { color: var(--txt); font-weight: 500; }

/* ---------- resultado ---------- */
.q4-res-tit { font-size: clamp(28px, 8vw, 36px); line-height: 1.08; font-weight: 700; letter-spacing: -.04em; margin: 6px 0 14px; text-wrap: balance; }
.q4-res-sub { font-size: clamp(17px, 4.7vw, 19px); line-height: 1.42; font-weight: 500; color: #E4E4E9; margin: 0 0 26px; }
.q4-res-sub span { display: block; }
.q4-res-sub span + span { margin-top: 6px; }

.q4-cena { border-left: 2px solid var(--red); padding: 2px 0 2px 16px; margin: 0 0 28px; }
.q4-rot { display: block; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
.q4-cena-l { font-size: clamp(18px, 4.9vw, 20.5px); line-height: 1.34; font-weight: 650; letter-spacing: -.022em; color: var(--txt); margin: 0 0 11px; }
.q4-cena-p { font-size: clamp(15px, 4.1vw, 16px); line-height: 1.55; color: #9C9CA6; margin: 0; }

.q4-custo { border: 1px solid var(--red-line); background: var(--red-soft); border-radius: 14px; padding: clamp(16px, 5vw, 20px); margin: 0; }
.q4-custo p { font-size: clamp(15px, 4.2vw, 16px); line-height: 1.55; color: #D6D6DC; margin: 0; }

.q4-pecas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 0 0 4px; }
.q4-peca { border: 1px solid var(--line); border-radius: 12px; padding: 12px 9px 13px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.q4-peca.on { border-color: var(--red-line); background: var(--red-soft); }
.q4-peca-n { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: #4E4E57; }
.q4-peca.on .q4-peca-n { color: var(--red); }
.q4-peca-t { font-size: clamp(10.5px, 3vw, 12px); line-height: 1.3; hyphens: auto; overflow-wrap: anywhere; font-weight: 650; letter-spacing: -.01em; color: #7C7C86; }
.q4-peca.on .q4-peca-t { color: var(--txt); }
.q4-legenda { font-size: clamp(13px, 3.6vw, 14px); line-height: 1.5; color: #8A8A93; margin: 0 0 22px; }

/* oferta \u2014 topo */
.q4-plano-sub { font-size: clamp(16px, 4.4vw, 17.5px); line-height: 1.45; color: #C7C7CE; margin: 0 0 26px; font-weight: 500; }
.q4-mud { display: flex; flex-direction: column; gap: 8px; margin: 0 0 6px; }
.q4-mud-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
.q4-mud-de { font-size: clamp(13.5px, 3.7vw, 14.5px); line-height: 1.35; color: #6E6E78; }
.q4-mud-para { font-size: clamp(14.5px, 4vw, 15.5px); line-height: 1.35; color: var(--txt); font-weight: 600; display: flex; gap: 9px; align-items: baseline; }
.q4-mud-para i { color: var(--red); font-style: normal; font-weight: 700; flex: 0 0 auto; }

.q4-foco { display: flex; flex-direction: column; gap: 9px; margin: 0; }
.q4-foco-item { border: 1px solid var(--line); border-radius: 14px; padding: clamp(14px, 4.4vw, 18px); }
.q4-foco-item.on { border-color: var(--red-line); background: var(--red-soft); }
.q4-foco-tag { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #6E6E78; margin-bottom: 9px; }
.q4-foco-item.on .q4-foco-tag { color: var(--red); }
.q4-foco-tag b { width: 17px; height: 17px; border-radius: 50%; border: 1px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 9.5px; flex: 0 0 17px; }
.q4-foco-item p { font-size: clamp(15px, 4.1vw, 16.5px); line-height: 1.45; margin: 0; color: #9C9CA6; }
.q4-foco-item.on p { color: var(--txt); font-weight: 500; }

/* proximo passo */
.q4-specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 22px 0 34px; }
.q4-spec { border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.q4-spec span { font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #5A5A64; }
.q4-spec b { font-size: clamp(14px, 3.9vw, 15.5px); font-weight: 650; letter-spacing: -.015em; color: var(--txt); }
.q4-spec.red b { color: var(--red); }
.q4-marca { display: flex; flex-direction: column; gap: 18px; margin: 52px 0 30px; }
.q4-marca p { display: flex; gap: 11px; align-items: flex-start; font-size: clamp(14.5px, 4vw, 15.5px); line-height: 1.45; color: #C7C7CE; margin: 0; }
.q4-marca p b { color: var(--red); flex: 0 0 auto; font-weight: 700; line-height: 1.35; }
.q4-marca p span strong { color: var(--txt); font-weight: 650; }
/* onde isso trava \u2014 elo quebrado */
.q4-elo { margin: 4px 0 20px; }
.q4-elo-nos { display: flex; align-items: stretch; gap: 8px; }
.q4-elo-no { flex: 1; border: 1px solid var(--line); border-radius: 13px; padding: 13px 11px; text-align: center; display: flex; flex-direction: column; gap: 6px; justify-content: center; min-width: 0; }
.q4-elo-no span { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6E6E78; }
.q4-elo-no b { font-size: clamp(12.5px, 3.5vw, 14px); font-weight: 650; letter-spacing: -.015em; color: var(--txt); line-height: 1.25; }
.q4-elo-x { flex: 0 0 auto; align-self: center; width: 30px; height: 30px; border-radius: 50%; background: var(--bg); border: 1.4px dashed var(--red); color: var(--red); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.q4-elo-falta { border-left: 2px solid var(--red); padding: 3px 0 3px 15px; margin: 16px 0 0; font-size: clamp(15.5px, 4.3vw, 17.5px); line-height: 1.36; font-weight: 650; letter-spacing: -.02em; color: var(--txt); }

/* linha do tempo do valor \u2014 oferta */
.q4-tl { position: relative; margin: 16px 0 14px; padding-left: 30px; }
.q4-tl::before { content: ""; position: absolute; left: 9px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(#2E2E36, var(--red)); }
.q4-tl-item { position: relative; padding-bottom: 28px; }
.q4-tl-item:last-child { padding-bottom: 0; }
.q4-tl-item::before { content: ""; position: absolute; left: -26px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid #3F3F48; }
.q4-tl-item.on::before { border-color: var(--red); background: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
.q4-tl-rot { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #6E6E78; margin-bottom: 5px; }
.q4-tl-item.on .q4-tl-rot { color: var(--red); }
.q4-tl-txt { font-size: clamp(14.5px, 4vw, 16px); line-height: 1.4; color: #C7C7CE; margin: 0; }
.q4-tl-item.on .q4-tl-txt { color: var(--txt); font-weight: 550; }

/* fascination bullets \u2014 oferta */
.q4-fasc { display: flex; flex-direction: column; gap: 20px; margin: 18px 0 12px; }
.q4-fasc-item { display: flex; gap: 12px; align-items: flex-start; }
.q4-fasc-item i { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--red-soft); border: 1px solid var(--red-line); color: var(--red); display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; font-style: normal; margin-top: 2px; }
.q4-fasc-item p { font-size: clamp(15px, 4.1vw, 16.5px); line-height: 1.42; color: #D6D6DC; margin: 0; }
.q4-fasc-item p b { color: var(--txt); font-weight: 650; }

.q4-dim { color: #9C9CA6; font-size: clamp(14.5px, 4vw, 15.5px); line-height: 1.55; }

.q4-leitura { display: flex; flex-direction: column; gap: 18px; border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; margin-bottom: 8px; }
.q4-med-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 9px; }
.q4-med-top span { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.q4-med-top b { font-size: clamp(12.5px, 3.4vw, 13.5px); color: var(--txt); font-weight: 650; text-align: right; }
.q4-med-segs { display: flex; gap: 5px; }
.q4-med-seg { flex: 1; height: 6px; border-radius: 3px; background: #1B1B21; }
.q4-med-seg.on { background: #3F3F48; }
.q4-med-seg.on.red { background: var(--red); }

.q4-tri { display: block; width: 100%; max-width: 360px; margin: 6px auto 0; height: auto; }
.q4-tri-tag { display: inline-flex; align-items: center; gap: 9px; font-size: clamp(12.5px, 3.5vw, 13.5px); color: #D6D6DC; border: 1px solid var(--red-line); background: var(--red-soft); border-radius: 999px; padding: 8px 15px; margin: 4px 0 6px; }
.q4-tri-pin { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex: 0 0 7px; }

.q4-caso { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.q4-caso-quem { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
.q4-caso-l { font-size: clamp(14.5px, 4vw, 15.5px); line-height: 1.5; color: #C7C7CE; margin: 0; }
.q4-caso-l b { color: var(--txt); font-weight: 650; }
.q4-caso-img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }

/* ---------- oferta ---------- */
.q4-frente { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 24px 0; }
.q4-frente-mini { max-width: 250px; margin: 0 auto; }
.q4-frente-rot { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--red); display: block; margin-bottom: 8px; }
.q4-frente-txt p { font-size: clamp(15.5px, 4.3vw, 17px); line-height: 1.45; color: var(--txt); font-weight: 500; margin: 0; }

.q4-etapas-of { display: flex; flex-direction: column; gap: 2px; }
.q4-etapa-of { display: flex; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.q4-etapa-n { font-size: 12px; font-weight: 700; color: var(--red); letter-spacing: .08em; padding-top: 2px; flex: 0 0 22px; }
.q4-etapa-t { font-size: clamp(15.5px, 4.2vw, 16.5px); font-weight: 650; margin: 0 0 4px; letter-spacing: -.02em; }
.q4-etapa-p { font-size: clamp(14px, 3.9vw, 15px); line-height: 1.45; color: var(--mut); margin: 0; }

.q4-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.q4-chip { font-size: clamp(13px, 3.6vw, 14px); border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 8px 14px; color: #D6D6DC; }
.q4-nota { font-size: clamp(13px, 3.6vw, 13.5px); line-height: 1.5; color: var(--mut); margin: 12px 0 0; }

.q4-conv { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 18px 0; }
.q4-conv-item { background: var(--bg2); padding: 14px 16px; display: flex; gap: 12px; font-size: clamp(14.5px, 4vw, 15.5px); line-height: 1.42; color: #D6D6DC; }
.q4-conv-item span:first-child { color: var(--red); font-weight: 700; flex: 0 0 auto; }

.q4-vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.q4-vs-col { border: 1px solid var(--line); border-radius: 14px; padding: 15px 14px; }
.q4-vs-col.on { border-color: var(--red-line); background: var(--red-soft); }
.q4-vs-tit { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin-bottom: 12px; }
.q4-vs-col.on .q4-vs-tit { color: var(--red); }
.q4-vs-col p { font-size: clamp(13.5px, 3.7vw, 14.5px); line-height: 1.35; color: #C7C7CE; margin: 0 0 9px; padding-left: 13px; position: relative; }
.q4-vs-col p:last-child { margin-bottom: 0; }

   A jornada, em ordem:
   01 desejo     — o que a pessoa mais quer melhorar
   02 perfil     — qual é o modelo de negócio
   03 origem     — de onde vêm as vendas hoje (abre 8 vertentes)
   04 operacao   — como essas vendas são fechadas
   05 vertente   — 3 perguntas específicas do canal da pessoa
   06 descoberta — uma leitura curta do que já foi dito (checkpoint)
   07 consequencia — o impacto disso no negócio
   08 tentativa  — o que já tentou  ·  09 efeito — o que aconteceu depois
   10 nome · 11 carregamento · 12 diagnóstico + oferta

   Regras do motor:
   - Cada clique salva a resposta (ID estável) numa sessão única, no navegador
     e, se configurado, num banco (Supabase) via sincronização em segundo plano.
   - Depois de cada clique o contexto é recalculado a partir de TODAS as
     respostas válidas, e a próxima pergunta é escolhida por elegibilidade.
   - Trocar uma resposta antiga invalida o que vinha depois dela.
   - No fim, semantica.js + oferta.js cruzam todas as respostas ativas e
     montam UMA tese e a oferta ligada a ela.
   Textos ficam em objetos editáveis no modo editor; a lógica fica nas REGRAS.
========================================================================== */

function qzCtx(R,ordem){
 var x={R:R};
 x.desejo=qzAns(R,"desejo");
 var od=null;if(x.desejo)for(var i=0;i<QV.desejo.o.length;i++)if(QV.desejo.o[i].id===x.desejo)od=QV.desejo.o[i];

 x.rota=x.p==="empresa"?"emp":x.p==="profissional"?"pro":x.p==="mentor"?"men":x.p==="digital"?"dig":null;
 x.origem=qzAns(R,"origem");
 x.op=qzAns(R,"operacao");
 x.eqp=x.op==="equipe"||x.op==="misto";
 x.fund=x.op==="eu"||x.op==="misto";
 x.autonomo=x.op==="auto";
 x.sub=qzAns(R,"LOJ-1");                 /* sub-canal de loja/site/outros */
 /* evidências da vertente, na ordem em que foram respondidas */
 var ord=ordem||Object.keys(R);x.ev=[];
 ord.forEach(function(q){if(QZ_EV.indexOf(q)>=0&&R[q])x.ev.push({q:q,o:R[q].opcaoId})});
 x.nEv=x.ev.length;
 x.prim=x.ev[0]||null;
 x.primTipo=x.prim?((qzOpt(x.prim.q,x.prim.o,x)||{}).tipo):null;
 x.contradicao=x.ev.some(function(e){var o=qzOpt(e.q,e.o,x);return o&&o.tipo==="c"});
 x.e=function(q){return qzAns(R,q)};
 x.gEf=x.g;
 x.cons=qzAns(R,"CONS");x.tent=qzAns(R,"T1");x.efe=qzAns(R,"T2");

/* escolhe a próxima pergunta: elegível, ainda não feita, de maior prioridade */
function qzProxima(x,feitas){
 for(var d=0;d<QDIMS.length;d++){
  for(var i=0;i<QREGRAS.length;i++){var r=QREGRAS[i];
   if(r.dim!==QDIMS[d]||feitas.indexOf(r.id)>=0)continue;
   var ok=false;try{ok=r.ok(x)}catch(e){ok=false}
   if(ok&&qzDef(r.id,x))return r;
  }
 }
 return null;
}

/* reconstrói o caminho inteiro a partir das respostas salvas.
   Resposta que não cabe mais no caminho fica de fora do diagnóstico. */
function qzTrilha(resp){
 var ativas={},ordem=[],x=qzCtx(ativas,ordem),feitas=[],passos=[],chk=false,fim=false;
 for(var n=0;n<30;n++){
  var r=qzProxima(x,feitas);
  if(!r){fim=true;break}
  if(!chk&&r.dim==="consequencia"){chk=true;if(qzCheck(x))passos.push({tipo:"checkpoint",id:"checkpoint"})}
  passos.push({tipo:"q",id:r.id,dim:r.dim});feitas.push(r.id);
  var a=resp[r.id],d=qzDef(r.id,x);
  if(a&&d&&d.o.some(function(o){return o.id===a.opcaoId})){ativas[r.id]=a;ordem.push(r.id);x=qzCtx(ativas,ordem)}
  else break;
 }
 if(fim){passos.push({tipo:"nome",id:"nome"},{tipo:"load",id:"load"},{tipo:"resultado",id:"resultado"})}
 return{passos:passos,ativas:ativas,ordem:ordem,x:x,completo:fim};
}

/* estimativa honesta do total de perguntas (para a barra de progresso) */
function qzEstimativa(x,feitas){
 var t=4;                                  /* desejo, perfil, origem, operação */
 t+=x.origem==="loja"?3:3;                 /* vertente: 3 telas (loja: 1 + 2) */
 t+=1;                                     /* consequência */
 t+=1;                                     /* tentativa */
 if(!x.tent||x.tent!=="nada")t+=1;         /* efeito, quando houve tentativa */
 return Math.max(t,feitas+1);
}

function qzLabel(qid,oid,x){var o=qzOpt(qid,oid,x);return o?ED.tr(o.l):""}

function qzCheck(x){
 if(!x.origem||x.nEv<2)return null;
 var exp=x.g==="expansao";
 var vert=QVERT[x.origem]||{nome:"esse canal"};
 var evs=x.ev.slice(-2).map(function(e){return"“"+cs(qzLabel(e.q,e.o,x))+"”"});

 var ult=x.ev[x.ev.length-1],ou=qzOpt(ult.q,ult.o,x)||{},tipo=ou.tipo;
 var remate=tipo==="c"?"Essa resposta não confirma o que parecia. Vou levar isso em conta antes de concluir qualquer coisa."
  :tipo==="a"?"Você ainda não tem essa resposta, e isso é comum. Mas, sem saber onde acontece, qualquer mudança vira tentativa."

  :ED.T("Então boa parte do resultado hoje passa por {canal}. Ainda não dá para dizer a causa.",{canal:vert.nome});
 return{titulo:tipo==="c"||x.contradicao?"Isso muda a leitura.":tipo==="a"?"Isso também é uma informação.":exp?"Tem um sinal aqui.":"Tem um detalhe importante aqui.",

}

/* aplica um clique: salva, invalida o que vinha depois (se mudou) e recalcula tudo */
function qzResponder(s,trilha,idx,qid,oid){
 var n=JSON.parse(JSON.stringify(s)),ant=n.respostas[qid],mudou=!ant||ant.opcaoId!==oid;
 if(mudou){
  if(ant){qzEvento(n,"alteracao",{perguntaId:qid,de:ant.opcaoId,opcaoId:oid});
   trilha.passos.slice(idx+1).forEach(function(p){if(p.tipo==="q"&&n.respostas[p.id]){qzEvento(n,"invalidada",{perguntaId:p.id,opcaoId:n.respostas[p.id].opcaoId});delete n.respostas[p.id]}})}
  n.respostas[qid]={perguntaId:qid,opcaoId:oid,respondidaEm:new Date().toISOString(),versaoPergunta:QZ_VERSAO};
  qzEvento(n,"resposta",{perguntaId:qid,opcaoId:oid});
 }
 var t=qzTrilha(n.respostas);
 Object.keys(n.respostas).forEach(function(k){if(!t.ativas[k])delete n.respostas[k]});
 var P=t.completo?qzOferta(t):null;
 n.perguntasFeitas=t.ordem.slice();n.contextoDerivado=qzResumo(t.x,P);n.hipotesePrincipalId=P?P.primaryHypothesis.id:null;
 n.diagnosisId=P?P.diagnosisId:null;n.mainInterventionId=P?P.mainInterventionId:null;n.copyVersion=P?P.copyVersion:null;
 return{s:n,t:t,mudou:mudou,ant:ant};
}

   O motor soma TODAS as respostas ativas, sem contar duas vezes a mesma
   informação, aplica as contradições, escolhe UMA tese principal e só
   depois decide qual frente da operação faz sentido oferecer.

========================================================================= */

/* ---------------------------------------------------------------
   PIPELINE: normalizar → extrair sinais → contradições → hipóteses
   → tese → frente da OSTRON → plano da oferta → validação
---------------------------------------------------------------- */
var QZ_COPY_VERSAO="5.0.0";

function qoParse(spec){
 var p=String(spec||"").trim().split(/\s+/),at={cat:p[0]||"x",w:{},f:[],fam:null};
 for(var i=1;i<p.length;i++){var t=p[i];
  if(t.charAt(0)==="!")at.f.push(t.slice(1));
  else if(t.charAt(0)==="@")at.fam=t.slice(1);
  else{var m=/^([A-Z]{2})(-?\d+)$/.exec(t);if(m)at.w[m[1]]=parseInt(m[2],10)}}
 return at;
}
function qoAtomo(qid,oid){
 var m=QSEM[qid];return m&&m[oid]!=null?qoParse(m[oid]):null;
}

/* 1. fatos: todas as respostas ativas viram átomos */
function qoFatos(t){
 var x=t.x,F={x:x,rota:x.rota,origem:x.origem,sub:x.sub,op:x.op,eqp:!!x.eqp,fund:!!x.fund,a:{},flags:{},atoms:[],semClasse:[]};
 t.ordem.forEach(function(q){var oid=t.ativas[q].opcaoId;F.a[q]=oid;var at=qoAtomo(q,oid);
  if(!at){F.semClasse.push(q+":"+oid);return}
  at.q=q;at.o=oid;at.id=q+":"+oid;F.atoms.push(at);at.f.forEach(function(fl){F.flags[fl]=true})});
 if(F.eqp)F.flags.eqp=true;if(F.fund)F.flags.fund=true;
 if(x.origem)F.flags["canal_"+x.origem]=true;
 if(x.sub)F.flags["sub_"+x.sub]=true;
 if(x.g)F.flags.sintoma_conhecido=true;
 if(x.g==="expansao")F.flags.crescendo=true;
 var cxPrio=["sem_recompra","vai_bem","capacidade_ok","prosp_ok","mede_tudo"];
 F.conflitos=Object.keys(QCOPY.cx).filter(function(k){return F.flags[k]})
  .sort(function(p,q){return(cxPrio.indexOf(q)>=0)-(cxPrio.indexOf(p)>=0)});
 if(F.conflitos.length)F.flags.conflito=true;
 return F;
}

/* 2. a hipótese faz sentido para esse tipo de operação? */
function qoAplicavel(h,F){
 var fl=F.flags;
 /* a venda acontece numa página/checkout, sem ninguém conversando */
 var online=!!(fl.site||fl.pagina||fl.marketplace||fl.checkout);
 /* a venda acontece na loja física */
 var loja=!!fl.loja_fisica;
 /* existe alguém conversando com o cliente antes da compra */
 var conversa=!F.flags.autonomo&&!(loja&&!fl.conversa)&&!(online&&!fl.conversa);
 switch(h){
  case"PD":return !F.flags.autonomo&&(F.origem==="prosp"||F.origem==="parc"||F.eqp||F.rota==="emp");
  case"VS":return online;
  case"VP":return loja;
  case"RN":return conversa||F.flags.retoma||F.flags.sem_caminho;
  case"TC":return F.eqp;
  case"DE":return F.rota==="men"||F.rota==="pro";
  case"MR":return F.rota==="pro"||F.rota==="men";
  case"RA":return !F.flags.sem_recompra;
  default:return true;
 }
}

/* 3. pontuação: soma tudo, sem contar duas vezes a mesma informação */
function qoPontuar(F){
 var S={};Object.keys(QH).forEach(function(h){S[h]={h:h,fam:{},neg:0,sup:[],blk:[],total:0,nFam:0,direto:false}});
 var fl=F.flags,soOnline=!!(fl.site||fl.pagina||fl.marketplace||fl.checkout)&&!fl.conversa;
 F.atoms.forEach(function(at){Object.keys(at.w).forEach(function(h0){var v=at.w[h0],h=(soOnline&&h0==="RN")?"VS":h0,s=S[h];if(!s)return;
  if(v>0){var fam=at.fam||at.q;s.fam[fam]=Math.max(s.fam[fam]||0,v);s.sup.push(at.id)}
  else{s.neg+=v;s.blk.push(at.id)}})});
  Object.keys(S).forEach(function(h){var s=S[h],tot=0;Object.keys(s.fam).forEach(function(k){tot+=s.fam[k];if(s.fam[k]>0)s.nFam++;if(k!=="origem"&&s.fam[k]>=3)s.direto=true});
  s.total=tot+s.neg;s.ok=qoAplicavel(h,F)});
 return S;
}

/* 4. frente de trabalho da OSTRON para a hipótese, no contexto */
function qoIntervencao(h,F){
 var r=F.rota,fl=F.flags,men=r==="men";
 var online=!!(fl.site||fl.pagina||fl.marketplace||fl.checkout);
 var loja=!!fl.loja_fisica;
 switch(h){
  case"AP":return"I_COMPRADORES";case"AR":return"I_AQUISICAO";
  case"AV":
   if(online)return"I_COMPRA_ONLINE";
   if(loja)return"I_PONTO_VENDA";
   if(men)return"I_MENTOR_CONVERSA";
   if(F.origem==="prosp"||F.origem==="parc")return"I_PROPOSTA_B2B";
   return"I_OFERTA_VALOR";
  case"PD":return"I_PROPOSTA_B2B";
  case"RN":
   if(online)return men?"I_MENTOR_PAGINA":"I_COMPRA_ONLINE";
   if(men)return"I_MENTOR_CONVERSA";
   if(F.origem==="prosp"||F.origem==="parc")return"I_PROPOSTA_B2B";
   return"I_JORNADA_ATENDIMENTO";
  case"VS":return men?"I_MENTOR_PAGINA":"I_COMPRA_ONLINE";
  case"VP":return"I_PONTO_VENDA";case"TC":return"I_PLAYBOOK";case"DP":return"I_DEP_PESSOA";
  case"CE":case"MR":return"I_MODELO_CAPACIDADE";case"DE":return"I_ENTREGA";
  case"RA":return"I_REATIVACAO";case"NO":return"I_NOVA_OFERTA";case"EP":return"I_EXPANSAO";
  case"SP":return"I_VALIDACAO";default:return"I_DIAGNOSTICO";

}
/* ofertas que não podem aparecer nesse contexto */
function qoBloqueada(iv,F){
 var fl=F.flags;
 var online=!!(fl.site||fl.pagina||fl.marketplace||fl.checkout);
 if(!QINTV[iv])return"inexistente";
 if(F.flags.autonomo&&(iv==="I_JORNADA_ATENDIMENTO"||iv==="I_PLAYBOOK"||iv==="I_MENTOR_CONVERSA"))return"o cliente compra sem falar com ninguém";
 if(online&&!fl.conversa&&(iv==="I_JORNADA_ATENDIMENTO"||iv==="I_PLAYBOOK"))return"venda online sem atendimento";
 if(fl.loja_fisica&&iv==="I_COMPRA_ONLINE")return"venda na loja física";
 if(iv==="I_PLAYBOOK"&&!F.eqp)return"sem equipe para treinar";
 if(F.rota!=="men"&&(iv==="I_MENTOR_CONVERSA"||iv==="I_MENTOR_PAGINA"))return"não é mentoria";
 if(F.flags.sem_recompra&&iv==="I_REATIVACAO")return"produto sem recompra natural";
 return null;
}

/* 5. escolhe a hipótese principal (e a segunda, se empatar) */
function qoEscolher(F,S){
 var lista=QH_ORDEM.filter(function(h){return h!=="DI"&&h!=="SP"&&S[h].ok}).map(function(h){return S[h]});
 lista.sort(function(p,q){return q.total-p.total||QH_ORDEM.indexOf(p.h)-QH_ORDEM.indexOf(q.h)});
 var best=null,motivos=[];
 for(var i=0;i<lista.length;i++){var s=lista[i];if(s.total<3)break;var iv=qoIntervencao(s.h,F),b=qoBloqueada(iv,F);if(b){motivos.push(s.h+": "+b);continue}best=s;break}
 var h=best?best.h:(F.flags.crescendo?"SP":"DI");
 var cert="open";
 if(best){cert=(best.direto&&best.nFam>=2&&best.neg===0)?"supported_pattern":"plausible";
  if(F.flags.ns||F.flags.freq_fraca||F.flags.conflito)cert=cert==="supported_pattern"?"plausible":cert}
 /* empate com explicação diferente: mostra as duas, sem fingir certeza */
 var seg=null;
 if(best)for(var j=0;j<lista.length;j++){var o=lista[j];if(o===best||o.total<3)continue;
  if(o.total>=best.total&&qoIntervencao(o.h,F)!==qoIntervencao(best.h,F)&&!qoBloqueada(qoIntervencao(o.h,F),F)){seg=o;break}}
 if(seg&&cert==="supported_pattern")cert="plausible";
 return{h:h,s:best,cert:cert,seg:seg,ranking:lista.slice(0,5).map(function(s){return s.h+"="+s.total}),bloqueios:motivos};
}

function qoCasa(w,F){
 if(!w)return true;
 if(w.r&&w.r.indexOf(F.rota)<0)return false;
 if(w.m&&w.m.indexOf(F.mod)<0)return false;
 if(w.eqp!=null&&!!w.eqp!==F.eqp)return false;
 if(w.fund!=null&&!!w.fund!==F.fund)return false;
 if(w.f&&!w.f.every(function(k){return F.flags[k]}))return false;
 if(w.nf&&w.nf.some(function(k){return F.flags[k]}))return false;
 if(w.a&&!Object.keys(w.a).every(function(q){return w.a[q].indexOf(F.a[q])>=0}))return false;
 if(w.o&&!Object.keys(w.o).some(function(q){return w.o[q].indexOf(F.a[q])>=0}))return false;

}

function qoTentativa(h,F){

 var out={efeito:efe||null,textos:[],titulo:"Sobre o que você já tentou",tipo:null,contraste:null,fonte:["T1:"+x.tent].concat(x.efe?["T2:"+x.efe]:[])};
 if(efe&&QCOPY.efe[efe])out.textos.push(QCOPY.efe[efe]);

 if(tipo0&&x.efe!=="manteve"){var tipo=tipo0,dom=QH[h].dom;out.tipo=tipo;
  var c=QCOPY.contraste[tipo+">"+h]||QCOPY.contraste[tipo+">"+dom]||(h!=="DI"?QCOPY.contraste[tipo+">*"]:null);

/* 7. monta o plano da oferta (estruturado) e só então o texto */
function qzOferta(t){
 if(!t||!t.completo)return null;
 var F=qoFatos(t),S=qoPontuar(F),E=qoEscolher(F,S),h=E.h,x=F.x;
 var tese=qoTese(h,F)||qoTese("DI",F);

 ledger.push({claim:tese.tit,sourceAnswerIds:qoFontes(tese.w,F).concat(sup).filter(function(v,i,s){return s.indexOf(v)===i}),mode:E.cert==="supported_pattern"?"interpretation":"possibility"});
 if(cx)ledger.push({claim:cx,sourceAnswerIds:F.atoms.filter(function(at){return at.f.indexOf(F.conflitos[0])>=0}).map(function(at){return at.id}),mode:"reported"});
 if(obj)ledger.push({claim:obj.texto,sourceAnswerIds:[obj.fonte],mode:"interpretation"});
 if(con)ledger.push({claim:con.texto,sourceAnswerIds:[con.fonte],mode:"interpretation"});
 if(ten)ledger.push({claim:ten.textos.join(" "),sourceAnswerIds:ten.fonte,mode:"interpretation"});
 var avoid=["seu preço está errado","você está perdendo dinheiro","seu atendimento é ruim","percentuais ou valores de perda"];

 var cta={text:tese.cta||I.cta,tema:tese.tema||I.tema,tese:tese.tese||qoPonto(h),available:true};

 };

/* 8. validação: nada de promessa, número inventado ou oferta bloqueada */
function qoTextos(p){return[p.hero.headline,p.hero.body,p.hero.nota,p.primaryWork.title,p.primaryWork.explanation,(p.frentes||[]).map(function(f){return f.title+" "+f.description}).join(" "),p.consequence||"",p.tentativa?p.tentativa.textos.join(" "):"",p.methodSteps.map(function(s){return s.title+" "+s.description}).join(" "),(p.remainingQuestions||[]).join(" "),p.empate||"",p.cta.text].join(" \n ")}
function qoValidar(p,F){
 var e=[],txt=qoTextos(p);
 [/perdendo dinheiro/i,/já investiu muito/i,/vai parar/i,/\d+\s?%/,/garantimos|garantia de|resultado garantido|garantido que/i,/com certeza/i,/sem dúvida/i,/diagnóstico (fechado|confirmado|definitivo)/i,/R\$\s?\d/].forEach(function(r){if(r.test(txt))e.push("frase proibida: "+r)});
 if(/\{\w+\}|undefined|null/.test(txt))e.push("texto incompleto");
 if(F.flags.t_nenhuma&&/já tentou (de tudo|várias)/i.test(txt))e.push("tentativa inexistente");
 if(F.flags.t_manteve&&/nada (funcionou|resolveu)/i.test(txt))e.push("ignora mudança que funcionou");
 if(F.flags.leve&&/urgente|urgência|custando caro/i.test(txt))e.push("urgência com consequência leve");
 if(F.flags.sem_recompra&&/assinatura|fideliza|recompra/i.test(txt))e.push("recompra para produto sem recompra");
 var topo=p.hero.headline+" "+p.hero.body+" "+p.primaryWork.explanation;
 if(F.flags.autonomo&&/vendedor|conversa de venda|negociaç/i.test(topo))e.push("vendedor onde o cliente compra sozinho");
 if(!F.eqp&&/treina a equipe|treinar a equipe|sua equipe comercial|cobrar mais ligações/i.test(topo))e.push("equipe que não existe");
 if(F.rota!=="men"&&/mentoria|alunos|programa/i.test(topo))e.push("linguagem de mentoria fora de mentoria");
 var b=qoBloqueada(p.mainInterventionId,F);if(b)e.push("frente bloqueada: "+b);
 if(p.offerFit==="not_now"&&/vamos corrigir|resolvemos/i.test(txt))e.push("promete correção comercial sem encaixe");
 var ativos=p.activeAnswerIds;
 p.claimLedger.forEach(function(c){c.sourceAnswerIds.forEach(function(id){if(ativos.indexOf(id)<0)e.push("afirmação sem resposta ativa: "+id)})});
 return e;
}

.q4-fr{display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.q4-fr:first-of-type{border-top:none}
.q4-fr-i{flex:0 0 auto;color:var(--red);font-weight:700;margin-top:1px}
.q4-fr b{display:block;font-size:clamp(15.5px,4.2vw,16.5px);color:#fff;margin-bottom:3px;font-weight:650}
.q4-fr span{font-size:clamp(14.5px,4vw,15.5px);line-height:1.5;color:#C9C9D1}
.q4-ofe{font-size:clamp(16px,4.4vw,17px);line-height:1.5;color:#fff;font-weight:500;margin:6px 0 10px}
body.ed-on .q4-site{width:calc(100% - 380px)!important}
.q4-edbtn{position:fixed;right:14px;bottom:14px;z-index:9999;background:#111115;border:1px solid #2a2a30;color:#CFCFD6;border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;opacity:.65;transition:all .2s;font-family:inherit;letter-spacing:.02em}
.q4-edbtn:hover{opacity:1;border-color:var(--red);color:#fff}
.q4-dbg{margin:30px 0 120px;border:1px dashed #33333B;border-radius:10px;padding:10px 12px;font-size:12px;color:#9A9AA3}
.q4-dbg pre{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.45;margin:8px 0 0;max-height:420px;overflow:auto}

/* Prioriza sinais observados e relevantes ao desejo, sem tratar respostas
   positivas como problemas ou transformar "não sei" em falha comprovada. */
function qsSinais(x){
 var alvo={atrair:[1],reunioes:[2,3],fechar:[4,5],frequencia:[1,5],sem_mim:[2,3,5],crescer:[1,3,4]};
 var etapas=alvo[x.desejo]||[];
 return x.ev.map(function(e,i){
  var op=qzOpt(e.q,e.o,x)||{},d=(QSITE.dor[e.q]||{})[e.o]||{},pt=0;
  if(!d.d||op.tipo==="c"||d.n)return{e:e,d:d,pt:-1};
  if(d.e)pt=8+(etapas.indexOf(d.e)>=0?4:0);
  else if(d.m||op.tipo==="a")pt=2;
  else if(op.tipo==="s")pt=5;
  if(x.desejo==="crescer"&&d.e)pt-=2;
  return{e:e,d:d,pt:pt-i*.01};
 }).filter(function(z){return z.pt>0}).sort(function(a,b){return b.pt-a.pt});
}
function qsFraseTentativa(x){
 if(!x.tent||x.tent==="nada"||!QSITE_TENTATIVAS[x.tent])return"";
 var fez=QSITE_TENTATIVAS[x.tent],efeito=QSITE_EFEITOS[x.efe];
 return efeito?"Você já "+fez+(x.efe==="manteve"||x.efe==="cedo"?", e ":", mas ")+efeito+".":"Você já "+fez+".";
}
function qsFraseLead(x,P,s,alvo,marcas){
 var nome=qsEsc((s.nome||"").trim());
 var quem=nome?nome+", ":"";
 var eco=qzEco("origem",x.origem,x);
 var perfil=x.p==="mentor"?"na sua mentoria":x.p==="profissional"?"nos seus serviços":x.p==="digital"?"no seu negócio digital":"na sua empresa";
 var msg=quem+"você quer "+alvo.desejo+" "+perfil+".";
 var dor=marcas.length?marcas[0].d.d:"";
 if(eco&&dor)msg+=" Hoje, "+qsEsc(eco)+" e "+qsEsc(dor)+".";
 else if(eco)msg+=" Hoje, "+qsEsc(eco)+".";
 else if(dor)msg+=" Você contou que "+qsEsc(dor)+".";
 if(x.cons&&QSITE_IMPACTOS[x.cons])msg+=" Você também apontou que "+QSITE_IMPACTOS[x.cons]+".";
 var fez=qsFraseTentativa(x);if(fez)msg+=" "+qsEsc(fez);
 msg+=" A Antevisan combina IA, estratégia e processo comercial para "+(QSITE_ACOES[x.desejo]||QSITE_ACOES.atrair)+".";
 return msg;
}
function qsTextos(x,P,s){
 var nome=qsEsc((s.nome||"").trim()),ck=x.origem==="loja"?(x.sub||"outra"):x.origem;
 var C=QSITE.canal[ck]||QSITE.canal.sem,alvo=QSITE_OBJETIVOS[x.desejo]||QSITE_OBJETIVOS.atrair;
 var neg=QSITE.neg[x.p]||"o seu negócio";
 var foco=QSITE_FOCOS[(P&&P.primaryHypothesis&&P.primaryHypothesis.code)||"DI"]||QSITE_FOCOS.DI;
 var segura=P&&P.primaryHypothesis&&P.primaryHypothesis.certainty==="supported_pattern";
 var sinais=qsSinais(x),evs=x.ev.map(function(e){var o=qzOpt(e.q,e.o,x)||{},d=(QSITE.dor[e.q]||{})[e.o]||{};return{q:e.q,o:e.o,tipo:o.tipo,d:d}});
 var leak=QSITE.leak.slice(),vazou=false;
 evs.forEach(function(e){var st=e.d.e;if(st&&e.d.v&&leak[st-1]===QSITE.leak[st-1]){leak[st-1]=e.d.v;if(st>1)vazou=true}});
 var mdor="";evs.forEach(function(e){if(!mdor&&e.d.m&&e.d.d)mdor=e.d.d});
 if(!mdor&&x.efe==="sem_dados")mdor=QSITE.faq5.sem_dados;
 var op=QSITE.sis[x.op]?x.op:"varios";
 var T=QSITE.tentou,fit=QSITE.fit_h2;
 if(x.tent&&x.tent!=="nada"){
  if(x.efe==="temporario"||x.efe==="nada")fit=qsF(T.falhou,{curto:T.curto[x.tent]||""});
  else if(x.efe==="manteve")fit=T.ajudou;
  else if(T.obj[x.tent])fit=qsF(T.incerto,{obj:T.obj[x.tent]});
 }
 if(x.desejo==="crescer"&&(!x.tent||x.tent==="nada"))fit="Para crescer sem perder o que já funciona, três coisas precisam <em>trabalhar juntas.</em>";
 var adsQ=x.origem==="ads"||x.tent==="anuncios";
 var f1=QSITE.faq1[op]||QSITE.faq1.varios;
 var ehCaptacao=x.desejo==="atrair";
 var k=ehCaptacao?C.k:alvo.k;
 var conclusao=QSITE_IMPACTOS[x.cons]||"";
 var impl=QSITE.impl[op];
 if(x.desejo==="fechar"){
  impl=x.op==="auto"?"Seu cliente compra sem falar com ninguém. Nós melhoramos <em>o caminho do interesse até a compra.</em>":
   x.op==="eu"?"Você conduz as negociações. Nós fortalecemos <em>o caminho até a venda.</em>":

 }
 else if(x.desejo==="reunioes"){
  impl=x.op==="auto"?"Seu cliente compra direto. Nós melhoramos <em>o caminho até a decisão.</em>":
   x.eqp?"Sua equipe foca nas conversas. Nós organizamos <em>o caminho até elas.</em>":
   "Você foca nas conversas. Nós organizamos <em>o caminho até elas.</em>";
 }
 else if(x.desejo==="sem_mim")impl="Você foca em crescer. Nós organizamos <em>um comercial que não dependa de tudo passar por você.</em>";
 var fase=P&&P.primaryHypothesis&&P.primaryHypothesis.certainty==="open"?"Precisamos confirmar ":"Vale investigar primeiro ";
 var step1=qsCap(fase+foco.onde)+" e entender quem compra de você, como chega e o que já funciona.";
 var processo=qsF(QSITE.sis[op],{neg:neg});
 if(x.desejo==="sem_mim")processo="Cada oportunidade com uma próxima etapa definida, responsáveis claros e acompanhamento que não depende de você lembrar de tudo.";
 var fimP=ehCaptacao?qsF(QSITE.final_p,{neg:neg,abre_cons:""}):qsF(alvo.final_p,{neg:neg});
 if(nome)fimP="<b>"+nome+"</b>, "+fimP.charAt(0).toLowerCase()+fimP.slice(1);
 var pTexto=qsFraseLead(x,P,s,alvo,sinais);
 var prova=sinais.some(function(z){return z.d.e});
 return{
  h1:ehCaptacao?qsF(C.h1,{neg:neg}):alvo.h1,
  lead:pTexto,
  btn_hero:QSITE.btn_hero,btn_como:QSITE.btn_como,
  k1:k[0],k2:k[1],k3:k[2],k4:k[3],kfinal:ehCaptacao?qsF(C.kfinal,{neg:neg}):alvo.kfinal,
  perdas_h2:x.desejo==="crescer"&&!prova?"Crescer não é só colocar <em>mais gente no funil.</em>":QSITE.perdas_h2,
  leak1:leak[0],leak2:leak[1],leak3:leak[2],leak4:leak[3],leak5:leak[4],
  quote:(!prova&&x.desejo==="crescer")?"O próximo passo não é sair mudando tudo. É descobrir <em>onde ainda existe espaço para crescer.</em>":vazou?QSITE.quote_vaza:QSITE.quote,
  fit_h2:fit,
  fit_oferta:qsF(x.tent==="oferta"?"Você já mexeu na oferta. Agora, "+alvo.oferta.charAt(0).toLowerCase()+alvo.oferta.slice(1):alvo.oferta,{neg:neg}),
  fit_com:segura?foco.acao:alvo.com,
  fit_sis:processo,
  res_h2:x.desejo==="crescer"?"Com processo, o próximo nível pode aparecer <em>nos resultados.</em>":QSITE.res_h2,
  impl_h2:impl,
  step1:step1,
  step2:QSITE.step2,
  step3:QSITE.step3[op],
  step4:mdor?QSITE.step4_mede:QSITE.step4,
  faq_q1:f1.p,faq_a1:f1.r,
  faq_q2:QSITE.faq2.p[x.p]||QSITE.faq2.p.empresa,faq_a2:QSITE.faq2.r,
  faq_q3:adsQ?QSITE.faq3.p_ads:QSITE.faq3.p,faq_a3:QSITE.faq3.r+(C.anuncio?" "+C.anuncio:""),
  faq_q4:QSITE.faq4.p,faq_a4:QSITE.faq4.r,
  faq_q5:QSITE.faq5.p,faq_a5:mdor?qsF(QSITE.faq5.r_mede,{mdor:qsEsc(mdor)}):QSITE.faq5.r,
  final_big:ehCaptacao?qsF(C.final,{neg:neg}):qsF(alvo.final,{neg:neg}),
  final_p:fimP
 };

   o avanço vem do que a pessoa entendeu, não de um diagnóstico de mentira.
